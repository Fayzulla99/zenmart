<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market</title>
    <!-- <link rel="stylesheet" href="index-homework3.css"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      table.vegan-table th:nth-child(1):hover{
        background-color: rgb(1, 110, 100);
      }
      table.vegan-table th:nth-child(2):hover{
        background-color: rgb(1, 110, 100);
      }

      table.vegan-table tr:hover {
        background-color: lightgreen;
      }
      table.vegan-table /* orta qator(Vegatables)*/
      tr:nth-child(2):hover {
        background-color: lightgreen;
      }
      table.vegan-table li:hover {
        background-color: yellow;
      }

      /*tabellar======================================================*/
      table.vegan-table {
        width: 100%;
        background-color: #ddd;
        text-align: left;
        border-collapse: collapse;
        border-radius: 5px;
        font-family: cursive;
      }
      table.vegan-table th,
      td {
        padding: 5px 10px;
        box-shadow: 0px 1px 1px white;
      }
      table.vegan-table th:nth-child(1) {
        /*Categories*/
        border-top-left-radius: 5px;
        background-color: rgb(1, 110, 206);
        color: white;
        border-right: 1px white solid;
      }
      table.vegan-table th:nth-child(2) {
        /*Items*/
        border-top-right-radius: 5px;
        background-color: rgb(1, 110, 206);
        width: 40%;
        color: white;
      }
      table.vegan-table tr:nth-child(3) td:first-child {
        /*pastki chap-burchak*/
        border-bottom-left-radius: 5px;
      }
      table.vegan-table tr:nth-child(3) td:last-child {
        /*pastki o'ng-burchak*/
        border-bottom-right-radius: 5px;
      }

      table.vegan-table /* orta qator(Vegatables)*/
      tr:nth-child(2) {
        background-color: aliceblue;
      }
      table.vegan-table /* item data qatori*/
      td ol {
        list-style-type: none;
        padding-left: 0px;
        margin: 5px 0px;
      }
      /* ========================================================*/
      .web-p {
        text-decoration: none;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        color: rgb(67, 139, 255);
      }
      .web-p:hover {
        color: orange;
      }
      input {
        outline: none;
        border-radius: 5px;
        border: 2px solid rgb(67, 139, 255);
        width: 250px;
        height: 22px;
      }
      input:hover {
        background-color: #ddd;
        box-shadow: 1px 1px 2px;
      }
      input:focus {
        background-color: #ddd;
        box-shadow: 1px 1px 2px green;
        border-color: green;
      }
      .yuborish {
        background-color: rgb(4, 121, 245);
        color: white;
        border: 1px solid rgb(4, 121, 245);
        border-radius: 4px;
        padding: 5px;
        width: 80px;
        height: 25px;
      }
      .yuborish:hover {
        background-color: rgb(4, 121, 222);
        box-shadow: 2px 2px 4px;
      }
      h2{
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <table class="vegan-table">
      <thead>
        <tr>
          <th>Categories</th>
          <th>Items</th>
        </tr>
      </thead>
      <tbody class="body-data">
        <tr>
          <td>
            <i
              class="fa-brands fa-apple"
              style="color: rgb(116, 192, 252); margin-right: 10px"
            ></i
            >Fruits
          </td>
          <td>
            <ol>
              <li>Apple</li>
              <li>Orange</li>
              <li>Banana</li>
            </ol>
          </td>
        </tr>
        <tr>
          <td>
            <i
              class="fa-solid fa-carrot"
              style="color: rgb(116, 192, 252); margin-right: 10px"
            ></i
            >Vegetables
          </td>
          <td>
            <ol>
              <li>Carrot</li>
              <li>Tomato</li>
            </ol>
          </td>
        </tr>
        <tr>
          <td>
            <i
              class="fa-solid fa-wheat-awn"
              style="color: rgb(116, 192, 252); margin-right: 10px"
            ></i
            >Grains
          </td>
          <td>
            <ol>
              <li>Rice</li>
              <li>Wheat</li>
              <li>Quinoa</li>
            </ol>
          </td>
        </tr>
      </tbody>
    </table>
    <h2>Fikr bildirish</h2>
    <input type="text" />
    <button class="yuborish">Yuborish</button>
    <p>
      Bizning
      <a class="web-p" href="https://www.naver.com/">web-saytimizga</a> tashrif
      buyuring
    </p>
  </body>
</html>
