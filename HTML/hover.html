<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="roundedtable.css" />
    <style>
      table.rounded-corners {
        border-spacing: 0;
        border-collapse: separate;
        border-radius: 9px;
        /* border:1px solid black; */
        width: 100%;
        text-align: center;
        overflow: hidden;
      }

      table.rounded-corners th:nth-child(1) {
        /*yuqori chap-burchak*/
        border-top-left-radius: 9px;
        border: 1px solid rgb(58, 56, 56);
        border-right: none;
      }
      table.rounded-corners th:nth-child(3) {
        /*yuqori ong-burchak*/
        border-top-right-radius: 9px;
        border: 1px solid rgb(71, 70, 70);
        border-left: none;
      }
      table.rounded-corners tr:nth-child(3) td:last-child {
        /*pastki ong-burchak*/
        border-bottom-right-radius: 9px;
        border: 1px solid rgb(48, 47, 47);
        border-top: none;
        border-left: none;
      }

      table.rounded-corners tr:nth-child(3) td:first-child {
        /*pastki chap-burchak*/
        border-bottom-left-radius: 9px;
        border: 1px solid rgb(48, 47, 47);
        border-top: none;
        border-right: none;
      }
      table.rounded-corners tr:nth-child(1) td:nth-child(2),
      tr:nth-child(2) td:nth-child(2),
      tr:nth-child(3) td:nth-child(2) {
        border: 1px solid black;
        border-top: none;
      }

      table.rounded-corners th:nth-child(2) {
        border: 1px solid black;
      }
      table.rounded-corners tr:nth-child(1) td:nth-child(1),
      tr:nth-child(2) td:nth-child(1),
      tr:nth-child(3) td:nth-child(1) {
        border: 1px solid black;
        border-right: none;
        border-top: none;
      }
      table.rounded-corners tr:nth-child(1) td:nth-child(3),
      tr:nth-child(2) td:nth-child(3),
      tr:nth-child(3) td:nth-child(3) {
        border: 1px solid black;
        border-left: none;
        border-top: none;
      }
    </style>
  </head>
  <body>
    <table class="rounded-corners">
      <thead>
        <tr>
          <th>ism</th>
          <th>yosh</th>
          <th>adrees</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>david</td>
          <td>28</td>
          <td>toshkent</td>
        </tr>
        <tr>
          <td>migel</td>
          <td>28</td>
          <td>toshkent</td>
        </tr>
        <tr>
          <td>omar</td>
          <td>28</td>
          <td>toshkent</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
