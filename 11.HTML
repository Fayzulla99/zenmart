<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RelaxPlatform</title>
</head>
<body>
    <h1>Mening ismim Fayzulla</h1>

    <p></p>
    <!--QALIN TEXT(xariflar syutli bold)-->
    <b>Boldy Text</b><br/>

    <!--Strong ham qalin text boldy bilan birxil-->
    <strong>Strong text</strong><br/>

    <!--Italic stildagi text-->
    <i>Italiac Text</i><br/>

    <!--Yangi Italiac text lekin tepadagi bilan stili birxil-->
    <em>New Italiac text</em><br/>

    <!--Text tagiga chizish-->
    <u>Under lined Text</u><br/>

    <!--Alohida rang bilan belgilash (standard sariq rang)-->
    <mark>Marked text</mark><br/>

    <!--Textni ustidan chiziq tortib ochiradi-->
    <del>Deleted Text</del><br/>

    <!--Matn pastki qismiga chiziq <u> bilan birxil-->
    <ins>inserted text</ins><br/>
    
    <!--daraja korssatishda ishlatilinadi  -->
    H<sub>2</sub>O<!--patki daraja-->
    X<sup>2</sup><!--yuqori daraja-->


    <p>
        <mark>Lorem</mark>, ipsum dolor sit amet <u>consectetur</u> adipisicing elit.<br/>
         <b>Aliquid </b>cupiditate, incidunt perspiciatis <strong>aliquam </strong><br/>
         <del>exercitationem</del> odio commodi <i>quaerat</i><br/>
    </p>
</body>
</html>
